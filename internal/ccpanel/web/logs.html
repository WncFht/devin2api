<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#5438e1">
  <title data-i18n="logs.title">请求日志 - Devin2API</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/highlight-theme.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/logs.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/filters.css?v=__VERSION__">
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/template-engine.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/date-range-selector.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/filter-state.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/page-filters.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/highlight.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/modal.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-api.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-format.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-filters.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-notify.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-topbar.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-combobox.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-autorefresh.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui-codeview.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/searchable-select.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/marked.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/purify.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/markdown-renderer.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/merged-response-client.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/model-test-modal.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/logs.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/debug-log-modal.js?v=__VERSION__"></script>
</head>
<body>
  <div class="app-container">
    <!-- 主内容区域 -->
    <main id="main" class="main-content">
      <div class="content-area">
        <h1 class="visually-hidden" data-i18n="nav.logs">日志</h1>
        <div data-page-filters="logs"></div>

  
        <!-- 日志列表 -->
        <section class="mb-2">
          <div class="card">
           
            
            <!-- 当前总况指标条：当前时间窗聚合（/admin/stats），随列表同一节拍刷新 -->
            <div id="logsMetrics" class="logs-metrics" hidden></div>

            <!-- 列表提示条：管线前拒绝事件环 -->
            <div id="logsListHint" class="logs-list-hint" hidden></div>

            <!-- 表格工具条：列显隐与导出作用在表格/结果集上，不参与查询筛选 -->
            <div class="logs-table-toolbar">
              <button id="btn_col_settings" type="button" class="btn btn-secondary" data-action="toggle-col-menu" data-i18n-title="logs.colSettings" data-i18n-aria-label="logs.colSettings" aria-label="列显隐设置" title="列显隐设置"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg><span data-i18n="logs.colVisibility">列显隐</span></button>
              <button id="btn_export_csv" type="button" class="btn btn-secondary" data-i18n="logs.exportCsv">导出CSV</button>
              <button id="btn_export_json" type="button" class="btn btn-secondary" data-i18n="logs.exportJson">导出JSON</button>
            </div>

            <!-- 日志表格 -->
            <div class="table-container logs-table-container mobile-card-table-container" style="position: relative;">
              <!-- 列显隐下拉面板 -->
              <div id="colToggleMenu" class="logs-col-toggle-menu" hidden>
                <div class="logs-col-toggle-list" id="colToggleList"></div>
              </div>
              <table class="modern-table logs-table mobile-card-table">
                <thead>
                  <tr>
                    <th scope="col" class="logs-col-time" data-i18n="logs.colTime">时间</th>
                    <th scope="col" class="logs-col-ip" data-i18n="logs.colIP">IP</th>
                    <th scope="col" class="logs-col-token-desc" data-i18n="logs.colTokenDesc">令牌</th>
                    <th scope="col" class="logs-col-api-key" data-i18n="logs.colApiKey">Key 哈希</th>
                    <th scope="col" class="logs-col-model" data-i18n="common.model">模型</th>
                    <th scope="col" class="logs-col-account" data-i18n="logs.colAccount">账号</th>
                    <th scope="col" class="logs-col-status" data-i18n="logs.statusCode">状态码</th>
                    <th scope="col" class="logs-col-timing" data-i18n="logs.colTiming">首字/耗时(秒)</th>
                    <th scope="col" class="logs-col-speed" data-i18n="logs.colSpeed">速度(tok/s)</th>
                    <th scope="col" class="logs-col-input" data-i18n="logs.colInput">输入</th>
                    <th scope="col" class="logs-col-output" data-i18n="logs.colOutput">输出</th>
                    <th scope="col" class="logs-col-cache-read" data-i18n="logs.colCacheRead">缓存读</th>
                    <th scope="col" class="logs-col-cache-write" data-i18n="logs.colCacheWrite">缓存建</th>
                    <th scope="col" class="logs-col-cache-util" data-i18n="logs.colCacheUtil">缓存命中%</th>
                    <th scope="col" class="logs-col-cost" data-i18n="logs.colCost" data-i18n-title="logs.costTooltipHeader" title="标准成本：单价（美元/百万 Token）× 数量 = 费用">成本</th>
                    <th scope="col" class="logs-col-message" data-i18n="logs.colMessage">信息</th>
                  </tr>
                </thead>
                <tbody id="tbody">
                  <tr>
                    <td colspan="16" class="state-block--compact">
                      <div class="loading-spinner loading-spinner--block"></div>
                      <span data-i18n="logs.loading">正在加载日志...</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 底部分页控制 -->
        <section class="mb-2">
          <div class="card pagination-card">
            <div class="flex justify-center items-center">
              <div class="pagination-controls">
                <button id="logs_first2" class="btn btn-secondary btn-sm" type="button" data-action="first-logs-page">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 17l-5-5 5-5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18V6"/>
                  </svg>
                  <span data-i18n="common.firstPage">首页</span>
                </button>
                <button id="logs_prev2" class="btn btn-secondary btn-sm" type="button" data-action="prev-logs-page">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 18l-6-6 6-6"/>
                  </svg>
                  <span data-i18n="common.prevPage">上一页</span>
                </button>
                <span class="pagination-info">
                  <span data-i18n="pagination.pagePrefix">第</span> <span id="logs_current_page2" class="pagination-page-num">1</span> <span data-i18n="pagination.pageMid">页，共</span> <span id="logs_total_pages2" class="pagination-page-num">1</span> <span data-i18n="pagination.pageSuffix">页</span>
                  <span class="pagination-separator">|</span>
                  <span data-i18n="pagination.jumpTo">跳转到</span>
                  <input
                    type="number"
                    id="logs_jump_page"
                    class="pagination-jump-input"
                    min="1"
                    max="1"
                    data-i18n-placeholder="pagination.pagePlaceholder"
                    placeholder="页码"
                  />
                  <span data-i18n="pagination.pageUnit">页</span>
                </span>
                <button id="logs_next2" class="btn btn-secondary btn-sm" type="button" data-action="next-logs-page">
                  <span data-i18n="common.nextPage">下一页</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 6l6 6-6 6"/>
                  </svg>
                </button>
                <button id="logs_last2" class="btn btn-secondary btn-sm" type="button" data-action="last-logs-page">
                  <span data-i18n="common.lastPage">尾页</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7l5 5-5 5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6v12"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 空状态模板 -->
  <template id="tpl-log-empty">
    <tr>
      <td colspan="{{colspan}}" class="state-block">
        <svg class="w-12 h-12 mx-auto mb-4 state-icon--neutral" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <div class="state-title" data-i18n="logs.noData">暂无日志数据</div>
        <div class="state-desc" data-i18n="logs.adjustFilter">请调整筛选条件或检查时间范围</div>
      </td>
    </tr>
  </template>

  <!-- Debug Log 模态框 -->
  <div id="debugLogModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="debugLogTitle">
    <div class="modal-content upstream-detail-modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="debugLogTitle">
          <span data-i18n="logs.debugLogTitle">Debug Log</span>
          <span id="debugLogStatus" class="debug-log-status" hidden></span>
        </h2>
        <button type="button" class="close-btn" data-action="close-debug-log-modal" data-i18n-aria-label="common.close" aria-label="关闭">&times;</button>
      </div>
      <div id="debugLogLoading" class="state-block--compact" style="display: none;">
        <span data-i18n="logs.loading">加载中...</span>
      </div>
      <div id="debugLogError" class="state-block--compact state-title--error" style="display: none;"></div>
      <div id="debugLogContent" class="debug-log-content" style="display: none;">
        <div class="upstream-detail-tabs">
          <button type="button" id="debugRequestTabBtn" class="upstream-tab active" data-action="switch-debug-tab" data-tab="request" data-i18n="logs.debugRequest">Request</button>
          <button type="button" id="debugTranslatedRequestTabBtn" class="upstream-tab" data-action="switch-debug-tab" data-tab="translated-request" data-i18n="logs.debugTranslatedRequest" hidden>Translated Request</button>
          <button type="button" id="debugResponseTabBtn" class="upstream-tab" data-action="switch-debug-tab" data-tab="response" data-i18n="logs.debugResponse">Response</button>
          <button type="button" id="debugTranslatedResponseTabBtn" class="upstream-tab" data-action="switch-debug-tab" data-tab="translated-response" data-i18n="logs.debugTranslatedResponse" hidden>Translated Response</button>
          <button type="button" id="debugFilesTabBtn" class="upstream-tab" data-action="switch-debug-tab" data-tab="files" data-i18n="logs.debugFiles" hidden>Files</button>
          <button type="button" id="debugWrapBtn" class="upstream-copy-btn upstream-wrap-btn active" data-action="toggle-debug-wrap" data-i18n="logs.debugWrap" aria-pressed="true">换行</button>
          <button type="button" class="upstream-copy-btn upstream-copy-btn--tabs" data-action="copy-debug-pane" data-copy-target="debugReqRaw" data-i18n="common.copy">复制</button>
          <button type="button" id="debugMergeBtn" class="upstream-copy-btn upstream-merge-btn" data-action="merge-debug-response" data-i18n="logs.debugMerge" aria-pressed="false" hidden>合并</button>
        </div>
        <div class="upstream-tab-panel active" data-tab="request">
          <pre id="debugReqRaw" class="upstream-pre upstream-pre--full"></pre>
        </div>
        <div class="upstream-tab-panel" data-tab="translated-request">
          <pre id="debugTranslatedReqRaw" class="upstream-pre upstream-pre--full"></pre>
        </div>
        <div class="upstream-tab-panel" data-tab="response">
          <pre id="debugRespRaw" class="upstream-pre upstream-pre--full"></pre>
          <div id="debugRespMerged" class="upstream-merged-markdown upstream-pre--full" hidden><div class="chat-message chat-message--assistant"><div class="chat-message-content"></div></div></div>
        </div>
        <div class="upstream-tab-panel" data-tab="translated-response">
          <pre id="debugTranslatedRespRaw" class="upstream-pre upstream-pre--full"></pre>
          <div id="debugMergedNote" class="debug-merged-note" hidden></div>
          <div id="debugTranslatedRespMerged" class="upstream-merged-markdown upstream-pre--full" hidden><div class="chat-message chat-message--assistant"><div class="chat-message-content"></div></div></div>
        </div>
        <div class="upstream-tab-panel" data-tab="files">
          <div id="debugFileList" class="debug-file-list"></div>
          <div id="debugFileView" class="debug-file-view" hidden>
            <div class="debug-file-view-bar">
              <span id="debugFileViewName" class="debug-file-view-name"></span>
              <button type="button" id="debugFileRawBtn" class="upstream-copy-btn" data-action="copy-debug-file-raw" data-i18n="logs.debugFileCopyRaw">复制原始</button>
              <button type="button" class="upstream-copy-btn" data-action="open-debug-file-raw" data-i18n="logs.debugFileOpenRaw">打开原始内容</button>
            </div>
            <pre id="debugFileRaw" class="upstream-pre upstream-pre--full"></pre>
            <div id="debugFileBinary" class="debug-file-binary" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载状态模板 -->
  <template id="tpl-log-loading">
    <tr>
      <td colspan="{{colspan}}" class="state-block--compact">
        <div class="loading-spinner loading-spinner--block"></div>
        <span data-i18n="logs.loading">正在加载日志...</span>
      </td>
    </tr>
  </template>

  <!-- 错误状态模板 -->
  <template id="tpl-log-error">
    <tr>
      <td colspan="{{colspan}}" class="state-block">
        <svg class="w-12 h-12 mx-auto mb-4 state-icon--error" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.864-.833-2.634 0L4.18 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        <div class="state-title state-title--error" data-i18n="logs.loadFailed">加载失败</div>
        <div class="state-desc" data-i18n="logs.checkNetwork">请检查网络连接或重试</div>
      </td>
    </tr>
  </template>

</body>
</html>
