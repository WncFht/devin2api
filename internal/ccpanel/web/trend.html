<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="trend.title">请求趋势 - Devin2API</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/stats.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/echarts.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/template-engine.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/date-range-selector.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/filter-state.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/filter-query.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/page-filters.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/searchable-select.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/trend.js?v=__VERSION__"></script>
</head>
<body class="trend-page">
  <div class="app-container">
    <!-- 主内容区域 -->
    <main class="main-content">
      <div class="content-area">
        <div data-page-filters="trend"></div>

        <!-- 趋势图表 -->
        <section class="mb-8 trend-chart-section">
          <div class="glass-card trend-chart-card">
            <!-- 控件与图例：单行排布，窄屏时趋势类型组内部横滚 -->
            <div class="trend-chart-toolbar mb-6">
                <!-- 趋势类型切换 -->
                <div class="toggle-group" id="trend-type-group">
                  <div class="toggle-btn" data-type="count" data-i18n="trend.typeCount">调用次数</div>
                  <div class="toggle-btn" data-type="rpm" data-i18n="trend.typeRpm">RPM</div>
                  <div class="toggle-btn" data-type="tps" data-i18n="trend.typeTps">TPS</div>
                  <div class="toggle-btn active" data-type="first_byte" data-i18n="trend.typeFirstByte">首字响应</div>
                  <div class="toggle-btn" data-type="duration" data-i18n="trend.typeDuration">总耗时</div>
                  <div class="toggle-btn" data-type="tokens" data-i18n="trend.typeTokens">Token用量</div>
                  <div class="toggle-btn" data-type="cost" data-i18n="trend.typeCost">费用消耗</div>
                  <div class="toggle-btn" data-type="cache_hit" data-i18n="trend.typeCacheHit">缓存命中率</div>
                </div>
                <!-- 图表样式切换 -->
                <div
                  class="trend-chart-type-toggle"
                  id="trend-chart-type-group"
                  role="group"
                  data-i18n-aria-label="trend.chartType"
                  aria-label="图表类型"
                >
                  <button
                    class="btn btn-secondary btn-sm trend-chart-type-btn active"
                    type="button"
                    data-chart-type="line"
                    aria-pressed="true"
                    data-i18n="trend.lineChart"
                  >折线图</button>
                  <button
                    class="btn btn-secondary btn-sm trend-chart-type-btn"
                    type="button"
                    data-chart-type="bar"
                    aria-pressed="false"
                    data-i18n="trend.barChart"
                  >柱状图</button>
                </div>
                <!-- 模型序列筛选器 -->
                <div class="channel-filter-container">
                  <button class="btn btn-secondary btn-sm" id="btn-model-filter-toggle" type="button">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"/>
                    </svg>
                    <span data-i18n="trend.modelFilter">模型筛选</span>
                  </button>
                  <div class="channel-filter-dropdown hidden" id="model-filter-dropdown">
                    <div class="filter-header">
                      <span data-i18n="trend.selectModels">选择模型</span>
                      <div class="filter-actions">
                        <button class="filter-action" id="btn-select-all-models" type="button" data-i18n="common.selectAll">全选</button>
                        <button class="filter-action" id="btn-clear-all-models" type="button" data-i18n="common.clear">清空</button>
                      </div>
                    </div>
                    <div class="filter-content" id="model-filter-list">
                      <!-- 动态生成模型列表 -->
                    </div>
                  </div>
                </div>
                <!-- 自动刷新开关与间隔：0=关闭，选择存 localStorage -->
                <label class="trend-refresh-control" for="f_refresh_interval">
                  <span class="trend-refresh-label" data-i18n="trend.refreshInterval">自动刷新</span>
                  <select id="f_refresh_interval" class="filter-select trend-refresh-select">
                    <option value="0" data-i18n="trend.refreshOff">关闭</option>
                    <option value="10" data-i18n="trend.refresh10s">10秒</option>
                    <option value="30" data-i18n="trend.refresh30s">30秒</option>
                    <option value="60" data-i18n="trend.refresh1min">1分钟</option>
                    <option value="300" data-i18n="trend.refresh5min">5分钟</option>
                  </select>
                </label>
                <!-- 数据分桶粒度：0=自动按时间窗分档，选择存 localStorage -->
                <label class="trend-refresh-control trend-bucket-control" for="f_bucket_min">
                  <span class="trend-refresh-label" data-i18n="trend.bucketLabel">数据间隔</span>
                  <select id="f_bucket_min" class="filter-select trend-refresh-select">
                    <option value="0" data-i18n="trend.bucketAuto">自动</option>
                    <option value="10" data-i18n="trend.bucket10m">10 分钟</option>
                    <option value="30" data-i18n="trend.bucket30m">30 分钟</option>
                    <option value="60" data-i18n="trend.bucket1h">1 小时</option>
                    <option value="120" data-i18n="trend.bucket2h">2 小时</option>
                    <option value="360" data-i18n="trend.bucket6h">6 小时</option>
                  </select>
                </label>
                <!-- 数据粒度与规模（原图表下方信息行上移） -->
                <span class="trend-meta-chip" id="bucket-interval" data-i18n="trend.dataIntervalInit">数据更新间隔：--</span>
                <span class="trend-meta-chip" id="warm-status-item" style="display:none">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                  </svg>
                  <span id="warm-status"></span>
                </span>
            </div>

            <!-- 图表容器 -->
            <div class="chart-container">
              <div class="chart-loading" id="chart-loading">
                <div class="loading-spinner"></div>
                <div data-i18n="trend.loading">正在加载趋势数据...</div>
              </div>
              <div class="chart-error hidden" id="chart-error">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.864-.833-2.634 0L4.18 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                </svg>
                <div class="error-title" data-i18n="trend.loadFailed">加载失败</div>
                <div class="error-message" data-i18n="trend.checkNetwork">请检查网络连接或重试</div>
              </div>
              <!-- ECharts 容器 -->
              <div id="chart" class="w-full h-full hidden"></div>
            </div>

          </div>
        </section>
      </div>
    </main>
  </div>


  <!-- 模型筛选项模板 -->
  <template id="tpl-model-filter-item">
    <div class="channel-filter-item">
      <div class="channel-checkbox {{checkedClass}}"></div>
      <div class="channel-color-indicator" style="background-color: {{color}}"></div>
      <div class="channel-name">{{displayName}}</div>
    </div>
  </template>

</body>
</html>
