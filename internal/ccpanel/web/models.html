<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="models.title">模型注册表 - Devin2API</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/models.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/chat.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/model-test-modal.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/chat-modal.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/models.js?v=__VERSION__"></script>
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <div class="content-area">
        <header class="mt-2 mb-4">
          <div class="card models-head-card">
            <div class="models-head-row">
              <div>
                <h1 class="page-title mb-2" data-i18n="models.pageTitle">模型注册表</h1>
                <p class="page-subtitle" data-i18n="models.pageSubtitle">对外模型名的启用开关与重定向；重定向在别名解析之前生效</p>
                <p id="models-summary" class="page-subtitle"></p>
              </div>
              <button type="button" id="add-model-btn" class="btn btn-primary" data-i18n="models.add.button">+ 添加模型</button>
            </div>
          </div>
        </header>

        <section class="mb-2">
          <div class="time-range-container models-filter-bar">
            <div id="models-filter-pills" class="time-range-selector">
              <button type="button" class="time-range-btn active" data-filter="all" data-i18n="common.all">全部</button>
              <button type="button" class="time-range-btn" data-filter="disabled" data-i18n="models.filter.disabled">已禁用</button>
              <button type="button" class="time-range-btn" data-filter="redirected" data-i18n="models.filter.redirected">已重定向</button>
              <button type="button" class="time-range-btn" data-filter="override" data-i18n="models.filter.override">有覆盖</button>
            </div>
            <input id="models-filter" type="search" class="form-input"
              data-i18n-placeholder="models.filterPlaceholder" placeholder="筛选模型名" spellcheck="false">
          </div>
          <div class="models-filter-selects">
            <select id="f-provider" class="form-input">
              <option value="" data-i18n="models.filter.allProviders">全部供应商</option>
            </select>
            <select id="f-api" class="form-input">
              <option value="" data-i18n="models.filter.allApis">全部 API</option>
            </select>
            <select id="f-tier" class="form-input">
              <option value="" data-i18n="models.filter.allTiers">全部档位</option>
              <option value="free">free</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
            <select id="f-pricing" class="form-input">
              <option value="" data-i18n="models.filter.allPricings">全部定价</option>
            </select>
            <select id="f-sort" class="form-input" data-i18n-aria-label="models.sort.label" aria-label="排序">
              <option value="default" data-i18n="models.sort.default">默认排序</option>
              <option value="mult_asc" data-i18n="models.sort.multAsc">倍率 低→高</option>
              <option value="mult_desc" data-i18n="models.sort.multDesc">倍率 高→低</option>
              <option value="in_asc" data-i18n="models.sort.priceInAsc">输入价 低→高</option>
              <option value="in_desc" data-i18n="models.sort.priceInDesc">输入价 高→低</option>
              <option value="out_asc" data-i18n="models.sort.priceOutAsc">输出价 低→高</option>
              <option value="out_desc" data-i18n="models.sort.priceOutDesc">输出价 高→低</option>
              <option value="name" data-i18n="models.sort.name">名称 A→Z</option>
            </select>
          </div>
          <div id="models-tag-chips" class="tag-chip-list">
            <button type="button" class="tag-chip" data-tag="free" data-i18n="models.tag.free">免费</button>
            <button type="button" class="tag-chip" data-tag="promo" data-i18n="models.tag.promo">促销</button>
            <button type="button" class="tag-chip" data-tag="img" data-i18n="models.tag.img">图像</button>
            <button type="button" class="tag-chip" data-tag="beta">BETA</button>
            <button type="button" class="tag-chip" data-tag="new">NEW</button>
            <button type="button" class="tag-chip" data-tag="fast">FAST</button>
            <button type="button" class="tag-chip" data-tag="premium">Premium</button>
            <button type="button" class="tag-chip" data-tag="rec" data-i18n="models.tag.rec">推荐</button>
            <button type="button" class="tag-chip" data-tag="empty_mult" data-i18n="models.tag.emptyMult">无倍率</button>
            <button type="button" class="tag-chip" data-tag="disabled" data-i18n="models.tag.catalogDisabled">目录禁用</button>
          </div>
        </section>

        <section class="card mb-2">
          <div class="table-container mobile-card-table-container">
            <table class="modern-table mobile-card-table models-table">
              <thead>
                <tr>
                  <th data-i18n="models.col.model">模型</th>
                  <th data-i18n="models.col.provider">供应商</th>
                  <th data-i18n="models.col.tags">特性</th>
                  <th data-i18n="models.col.multiplier">倍率</th>
                  <th data-i18n="models.col.priceIn">输入价</th>
                  <th data-i18n="models.col.priceCached">缓存价</th>
                  <th data-i18n="models.col.priceOut">输出价</th>
                  <th data-i18n="models.col.source">来源</th>
                  <th data-i18n="models.col.enabled">启用</th>
                  <th data-i18n="models.col.resolved">实际解析</th>
                  <th data-i18n="common.actions">操作</th>
                </tr>
              </thead>
              <tbody id="models-tbody"></tbody>
            </table>
            <div id="models-empty" class="empty-state" hidden>
              <svg class="w-12 h-12 mx-auto mb-4 empty-state-icon--neutral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/>
              </svg>
              <h3 class="empty-state-title" data-i18n="models.emptyTitle">暂无模型</h3>
              <p data-i18n="models.emptyDesc">没有匹配筛选条件的模型</p>
            </div>
          </div>
          <p class="page-subtitle models-price-note" data-i18n="models.priceNote">倍率 = 上游 credit 消耗倍率；价格单位 $ / 1M tokens</p>
        </section>

        <section class="mb-2">
          <div class="card logs-pagination-card">
            <div class="flex justify-center items-center">
              <div class="pagination-controls logs-pagination-controls">
                <button id="models_first" class="btn btn-secondary btn-sm" type="button" data-action="first-page">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 17l-5-5 5-5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18V6"/>
                  </svg>
                  <span data-i18n="common.firstPage">首页</span>
                </button>
                <button id="models_prev" class="btn btn-secondary btn-sm" type="button" data-action="prev-page">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 18l-6-6 6-6"/>
                  </svg>
                  <span data-i18n="common.prevPage">上一页</span>
                </button>
                <span class="pagination-info logs-pagination-info">
                  <span data-i18n="logs.pagePrefix">第</span> <span id="models_current_page">1</span> <span data-i18n="logs.pageMid">页，共</span> <span id="models_total_pages">1</span> <span data-i18n="logs.pageSuffix">页</span>
                  <span class="logs-pagination-separator">|</span>
                  <span data-i18n="logs.jumpTo">跳转到</span>
                  <input
                    type="number"
                    id="models_jump_page"
                    class="logs-jump-input"
                    min="1"
                    max="1"
                    data-i18n-placeholder="logs.pagePlaceholder"
                    placeholder="页码"
                  />
                  <span data-i18n="logs.pageUnit">页</span>
                  <span class="logs-pagination-separator">|</span>
                  <select id="models_page_size" class="form-input">
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                  </select>
                </span>
                <button id="models_next" class="btn btn-secondary btn-sm" type="button" data-action="next-page">
                  <span data-i18n="common.nextPage">下一页</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 6l6 6-6 6"/>
                  </svg>
                </button>
                <button id="models_last" class="btn btn-secondary btn-sm" type="button" data-action="last-page">
                  <span data-i18n="common.lastPage">尾页</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7l5 5-5 5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6v12"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 添加模型对话框 -->
  <div id="addModelModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content modal-content--sm">
      <div class="modal-header">
        <h2 class="modal-title" data-i18n="models.add.modalTitle">添加模型</h2>
        <button type="button" class="close-btn" data-action="close-add-modal" data-i18n-aria-label="common.close" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="new-model-name" data-i18n="models.add.nameLabel">对外模型名</label>
          <input id="new-model-name" class="form-input"
            data-i18n-placeholder="models.add.namePlaceholder" placeholder="对外模型名" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="new-model-target" data-i18n="models.add.targetLabel">重定向目标（可选）</label>
          <input id="new-model-target" class="form-input" list="models-target-list"
            data-i18n-placeholder="models.add.targetPlaceholder" placeholder="留空则按别名链解析" spellcheck="false">
        </div>
      </div>
      <div class="modal-footer custom-rules-footer">
        <button type="button" class="btn btn-secondary" data-action="close-add-modal" data-i18n="common.cancel">取消</button>
        <button type="button" class="btn btn-primary" data-action="confirm-add-model" data-i18n="common.add">添加</button>
      </div>
    </div>
  </div>

  <!-- 重定向目标选择对话框：搜索过滤 + 点选应用，页脚可清除 -->
  <div id="redirectModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content modal-content--sm">
      <div class="modal-header">
        <h2 class="modal-title"><span data-i18n="models.redirect.title">重定向到</span> · <span id="redirect-model-name"></span></h2>
        <button type="button" class="close-btn" data-action="close-redirect-modal" data-i18n-aria-label="common.close" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <input id="redirect-search" class="form-input" data-i18n-placeholder="models.redirect.search"
          placeholder="搜索模型名" spellcheck="false" autocomplete="off">
        <p id="redirect-alias-note" class="chat-hint" data-i18n="models.redirect.aliasNote" hidden>当前经别名解析，非注册表重定向</p>
        <div id="redirect-model-list" class="redirect-list"></div>
      </div>
      <div class="modal-footer custom-rules-footer">
        <button type="button" id="redirect-clear" class="btn btn-secondary" data-action="clear-redirect" data-i18n="models.redirect.clear">清除重定向</button>
        <button type="button" class="btn btn-secondary" data-action="close-redirect-modal" data-i18n="common.cancel">取消</button>
      </div>
    </div>
  </div>

  <datalist id="models-target-list"></datalist>
</body>
</html>
