<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="accounts.title">上游账号 - Devin2API</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/accounts.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/accounts.js?v=__VERSION__"></script>
</head>
<body class="accounts-page">
  <div class="app-container">
    <main class="main-content">
      <div class="content-area">
        <!-- 页头：标题 + 更新时间 + 刷新 -->
        <section class="mb-6">
          <div class="glass-card" style="padding: var(--space-4) var(--space-6);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
              <h3 class="section-title" style="margin:0;">
                <svg class="inline-block w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span data-i18n="accounts.title">上游账号</span>
              </h3>
              <div style="display:flex;align-items:center;gap:12px;">
                <span id="accounts-updated-at" style="color:var(--color-text-secondary);font-size:12px;"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="accounts-refresh">
                  <span data-i18n="accounts.refresh">刷新</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 全池脉冲 + 汇总 -->
        <section class="mb-6">
          <div class="glass-card" style="padding: var(--space-6);">
            <h3 class="section-title mb-4" data-i18n="accounts.poolTitle">号池概览</h3>
            <div id="accounts-pulse" class="accounts-pulse" role="img" aria-label="pool health"></div>
            <div class="runtime-metrics-grid" id="accounts-kpi-grid" style="margin-top:16px;">
              <div class="loading-state" style="grid-column:1/-1;">
                <div class="loading-spinner loading-spinner--block"></div>
                <span data-i18n="accounts.loading">正在加载账号数据...</span>
              </div>
            </div>
          </div>
        </section>

        <!-- 逐账号卡片 -->
        <section class="mb-6">
          <div id="accounts-list">
            <div class="glass-card" style="padding: var(--space-6);">
              <div class="loading-state">
                <div class="loading-spinner loading-spinner--block"></div>
                <span data-i18n="accounts.loading">正在加载账号数据...</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

</body>
</html>
