<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="accounts.title">上游账号 - Devin2API</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/accounts.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/echarts.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/accounts-view.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/accounts-ops.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/accounts.js?v=__VERSION__"></script>
</head>
<body class="accounts-page">
  <div class="app-container">
    <main class="main-content">
      <div class="content-area">
        <!-- 页头：标题 + 更新时间 + 刷新 -->
        <header class="mt-2 mb-4">
          <div class="card accounts-head-card">
            <div class="accounts-head-row">
              <div>
                <h1 class="page-title mb-2" data-i18n="accounts.title">上游账号</h1>
                <p class="page-subtitle" data-i18n="accounts.pageSubtitle">各上游账号的速率闸门、连接保温与配额快照</p>
              </div>
              <div class="accounts-head-actions">
                <span id="accounts-filter" class="acct-filter" hidden></span>
                <select id="accounts-sort" class="filter-select acct-sort" data-i18n-aria-label="accounts.sort.label" aria-label="sort"></select>
                <span id="accounts-updated-at"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="accounts-refresh">
                  <span data-i18n="accounts.refresh">刷新</span>
                </button>
              </div>
            </div>
          </div>
          <!-- 加号表单挂载点：ops 渲染 .acct-form（端点缺席时留空） -->
          <div id="accounts-add"></div>
        </header>

        <!-- 全池脉冲 + 汇总 -->
        <section class="mb-6">
          <div class="card accounts-section-card">
            <h3 class="section-title mb-4" data-i18n="accounts.poolTitle">号池概览</h3>
            <div id="accounts-pulse" class="accounts-pulse" role="img" aria-label="pool health"></div>
            <div class="runtime-metrics-grid accounts-kpi-grid" id="accounts-kpi-grid">
              <div class="loading-state accounts-grid-full">
                <div class="loading-spinner loading-spinner--block"></div>
                <span data-i18n="accounts.loading">正在加载账号数据...</span>
              </div>
            </div>
          </div>
        </section>

        <!-- 逐账号卡片；空池时整页空态（view 渲染 .accounts-empty，含 #accounts-empty-add 内嵌表单挂点） -->
        <section class="mb-6">
          <div id="accounts-empty" hidden></div>
          <div id="accounts-list">
            <div class="card accounts-section-card">
              <div class="loading-state">
                <div class="loading-spinner loading-spinner--block"></div>
                <span data-i18n="accounts.loading">正在加载账号数据...</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

</body>
</html>
