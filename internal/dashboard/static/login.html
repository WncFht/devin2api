<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devin API - 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0e14;color:#e5e9f2;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{background:#12151f;border:1px solid rgba(148,163,184,.1);border-radius:12px;padding:40px;width:360px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.login-box h1{font-size:20px;margin-bottom:24px;text-align:center;color:#818cf8}
.login-box input{width:100%;padding:12px 16px;border:1px solid rgba(148,163,184,.2);border-radius:8px;background:#0b0e14;color:#e5e9f2;font-size:14px;margin-bottom:16px;outline:none}
.login-box input:focus{border-color:#818cf8}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:#818cf8;color:#fff;font-size:14px;cursor:pointer}
.login-box button:hover{background:#93a0fa}
.error{color:#f87171;font-size:13px;text-align:center;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="login-box">
<h1>Devin API 管理面板</h1>
<form id="loginForm">
<input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" autofocus>
<button type="submit">登录</button>
</form>
<div class="error" id="err">密码错误</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
const pwd=document.getElementById('password').value;
const res=await fetch('/panel/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(pwd)});
if(res.ok){location.reload()}else{const el=document.getElementById('err');el.style.display='block';setTimeout(()=>el.style.display='none',2000)}
});
</script>
</body>
</html>
