repos:
  # autocorrect 只改文本内容（中英文之间补空格、标点全半角），需 brew install autocorrect
  - repo: local
    hooks:
      - id: autocorrect
        name: autocorrect --fix
        entry: autocorrect --fix
        language: system
        types: [markdown]
  # prettier / markdownlint-cli2 一律走 node_modules 里的版本：package.json 是唯一版本清单，
  # 编辑器（prettierPath 指向同一处）与 hook 同源；缺依赖时响亮报错而非静默换版本。
  # 顺序即语义：先改内容（autocorrect）→ 再修规则（markdownlint --fix）→ prettier 最后写盘，
  # 保证落盘结果是 prettier 规范形，commit 后编辑器再 format 必然无 diff。
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 --fix
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
      - id: prettier
        name: prettier --write
        entry: ./node_modules/.bin/prettier --write
        language: system
        types: [markdown]
