server:
  listen: ":8080"
  # 同时处理的 /v1/* 请求数上限；0 或不填表示使用默认值 1024。
  max_concurrency: 1024

debug:
  enabled: false
  # 请求日志目录保留天数；<=0 不按时间清理。默认 14。
  # retention_days: 14
  # logs 目录总量上限（MB），超限从最旧目录开始删；<=0 不限制。默认 1024。
  # max_total_mb: 1024

devin:
  base_url: "https://server.codeium.com"
  token: "devin-session-token$mock-token"
  # model: "swe-1-7"
  model: "glm-5-2"
  # 代理地址（可选）；支持 http://、https://、socks5://、socks5h://
  # 留空则直连或走系统环境变量 HTTP_PROXY/HTTPS_PROXY。
  # proxy: "socks5://127.0.0.1:1080"
  # 强制 HTTP/1.1：每请求独立 TCP 连接，避免 HTTP/2 单连接多 stream 复用
  # 被上游串行处理导致并发卡住/首字延迟飙升。默认 true。
  # 如上游不支持 HTTP/1.1 流式可设 false 回到 HTTP/2。
  force_http1: true
  # 客户端模型名 → 上游真实 UID 的别名映射（可选）。
  # 例如客户端发 swe-2 / glm-5.2，上游实际 UID 是 swe-2-max / glm-5-2。
  # aliases:
  #   swe-2: "swe-2-max"
  #   glm-5.2: "glm-5-2"

dashboard:
  # 管理面板密码；留空则无需登录，直接进入 /panel。
  password: ""

auth:
  # OpenAI 兼容接口访问密钥；留空则不校验，任何客户端均可调用 /v1/*。
  # 客户端可通过 Authorization: Bearer <api_key> 或 X-Api-Key: <api_key> 传递。
  api_key: ""