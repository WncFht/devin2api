# devin 单 harness 冒烟:验证内置 devin agent 在容器里装得上、认得了证、跑得出轨迹
# 用法(在仓库根目录):
#   export DEVIN_API_KEY=<devin-session-token$...>
#   harbor run --config multi-harness-eval/jobs/smoke-devin.yaml
jobs_dir: multi-harness-eval/runs
job_name: smoke-devin
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 1
environment:
  type: docker
  force_build: true
datasets:
  - name: harbor/hello-world
agents:
  # Harbor 内置 devin agent:swe-2-max 的原生 harness,直连 api.devin.ai
  # 认证 DEVIN_API_KEY → 容器内 credentials.toml(不进 agent 进程 env)
  - name: devin
    model_name: devin/swe-2-max
    env:
      DEVIN_API_KEY: ${DEVIN_API_KEY}
    extra_allowed_hosts:
      - api.devin.ai
      - server.codeium.com
      - cli.devin.ai
      - static.devin.ai
