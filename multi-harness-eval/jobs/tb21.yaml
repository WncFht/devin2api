# 主力:Terminal-Bench 2.1 × 5 harness × n_attempts=5(TB 官方榜单下限,见 README §6)
# 跑之前先过 smoke.yaml。n_tasks 控制子集规模,去掉即全量。
jobs_dir: multi-harness-eval/runs
job_name: tb21
n_attempts: 5
orchestrator:
  type: local
  n_concurrent_trials: 8
environment:
  type: docker
  force_build: true
datasets:
  - name: terminal-bench/terminal-bench-2-1
    # n_tasks: 30   # 先跑子集省钱,确认无误后注释掉跑全量
agents:
  # 被测模型恒定 swe-2-max,网关改写;各 harness 的 model_name 只是过客户端校验的前台名
  - name: claude-code
    model_name: anthropic/claude-sonnet-4-5   # 须含 claude 家族词
    env:
      ANTHROPIC_BASE_URL: http://host.docker.internal:49173
      ANTHROPIC_AUTH_TOKEN: ${DEVIN_API_KEY}
    kwargs:
      version: "2.1.258"

  - name: kimi-code
    model_name: kimi-k3
    env:
      KIMI_MODEL_BASE_URL: http://host.docker.internal:49173
      KIMI_MODEL_API_KEY: ${DEVIN_API_KEY}
      KIMI_MODEL_CAPABILITIES: image_in,thinking
    kwargs:
      version: "0.42.0"

  - name: pi
    model_name: anthropic/swe-2-max
    env:
      ANTHROPIC_BASE_URL: http://host.docker.internal:49173
      ANTHROPIC_API_KEY: ${DEVIN_API_KEY}
    kwargs:
      model_api: anthropic-messages
      thinking: high

  - name: codex
    model_name: openai/swe-2-max
    env:
      OPENAI_BASE_URL: http://host.docker.internal:3003/v1
      OPENAI_API_KEY: ${DEVIN_API_KEY}
    kwargs:
      reasoning_effort: high
      web_search: disabled

  # swe-2-max 原生 harness,Harbor 内置 devin agent,直连 api.devin.ai
  - name: devin
    model_name: devin/swe-2-max
    env:
      DEVIN_API_KEY: ${DEVIN_API_KEY}
    extra_allowed_hosts:
      - api.devin.ai
      - server.codeium.com
      - cli.devin.ai
      - static.devin.ai
