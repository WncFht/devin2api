# 冒烟:每 harness 跑一道 hello-world,验证鉴权/协议/轨迹落盘
# 用法:先起 ccload(:49173)和 devin-2api(:3003),再 harbor run --config jobs/smoke.yaml
job_name: smoke
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 4
environment:
  type: docker
  force_build: true
datasets:
  - name: harbor/hello-world
agents:
  # 被测模型恒定 swe-2-max,网关改写;各 harness 的 model_name 只是过客户端校验的前台名
  # Anthropic Messages 端点(ccload)
  - name: claude-code
    model_name: anthropic/claude-sonnet-4-5   # 须含 claude 家族词
    env:
      ANTHROPIC_BASE_URL: http://host.docker.internal:49173
      ANTHROPIC_AUTH_TOKEN: ${DEVIN_API_KEY}
    kwargs:
      version: "2.1.258"

  - name: kimi-code
    model_name: kimi-k3
    env:
      KIMI_MODEL_BASE_URL: http://host.docker.internal:49173
      KIMI_MODEL_API_KEY: ${DEVIN_API_KEY}
      KIMI_MODEL_CAPABILITIES: image_in,thinking
    kwargs:
      version: "0.42.0"

  - name: pi
    model_name: anthropic/swe-2-max
    env:
      ANTHROPIC_BASE_URL: http://host.docker.internal:49173
      ANTHROPIC_API_KEY: ${DEVIN_API_KEY}
    kwargs:
      model_api: anthropic-messages
      thinking: high

  # OpenAI Responses 端点(devin-2api),唯一直连协议对的
  - name: codex
    model_name: openai/swe-2-max
    env:
      OPENAI_BASE_URL: http://host.docker.internal:3003/v1
      OPENAI_API_KEY: ${DEVIN_API_KEY}
    kwargs:
      reasoning_effort: high

  # swe-2-max 原生 harness,直连 api.devin.ai;需 PYTHONPATH=multi-harness-eval
  - import_path: eval_agents.devin_cli:DevinCli
    model_name: devin/swe-2-max
    env:
      DEVIN_SESSION_TOKEN: ${DEVIN_SESSION_TOKEN}
    extra_allowed_hosts:
      - api.devin.ai
      - server.codeium.com
      - cli.devin.ai
      - static.devin.ai
