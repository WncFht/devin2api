version: 2
# 依赖与 action 版本漂移目前全靠手动；dependabot 按周开 PR，
# govulncheck 管漏洞、它管版本新鲜度，两者互补。
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]

  # 生成绑定的独立模块（replace 目标）：go.mod 版本钉死跟随 Taskfile/
  # check-codegen.sh/ci.yml 的 codegen 工具版本，单升必挂 codegen-drift
  # （见 PR #4）——全部忽略，要升就连钉一起手动升。
  - package-ecosystem: gomod
    directory: /outputs/devin-proto-go
    schedule:
      interval: weekly
    groups:
      gomod-gen:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /scripts/panel-verify
    schedule:
      interval: weekly
    groups:
      npm-panel:
        patterns: ["*"]
