name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  binaries:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: devin-2api-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: devin-2api-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: devin-2api-linux-amd64
          - goos: linux
            goarch: arm64
            asset: devin-2api-linux-arm64
          # Windows 资产是 zip 包（exe + config.example.yaml + LICENSE）：
          # 该平台没有 deploy 脚本消费裸 exe，归档让用户一次下载即可运行；
          # unix 资产保持裸二进制，deploy 脚本直接下载热替换。
          - goos: windows
            goarch: amd64
            asset: devin-2api-windows-amd64.zip
          - goos: windows
            goarch: arm64
            asset: devin-2api-windows-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out="dist/${{ matrix.asset }}"
          [[ "${{ matrix.goos }}" == "windows" ]] && out="dist/devin-2api.exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "${out}" ./cmd/devin-2api

      - name: Package windows zip
        if: matrix.goos == 'windows'
        run: |
          cp config.example.yaml LICENSE dist/
          cd dist
          zip -q "${{ matrix.asset }}" devin-2api.exe config.example.yaml LICENSE
          rm devin-2api.exe config.example.yaml LICENSE

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Docker image + release
    needs: [test, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${GHCR}:${VERSION}"
          # 仅稳定版（无 - 后缀）推 MINOR/MAJOR 浮动 tag：v0.1.0 → 0.1, 0
          if [[ "${VERSION}" != *-* ]]; then
            MINOR="${VERSION%.*}"
            MAJOR="${VERSION%%.*}"
            TAGS="${TAGS},${GHCR}:${MINOR},${GHCR}:${MAJOR}"
          fi
          # latest 只跟随稳定版，预发布不动它
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS},${GHCR}:latest"
          fi
          # Docker Hub 在 secrets 配置后才会推送（条件登录见下）
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            TAGS="${TAGS},docker.io/${DOCKERHUB_USERNAME}/devin-2api:${VERSION},docker.io/${DOCKERHUB_USERNAME}/devin-2api:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum devin-2api-* | sort -k2 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/devin-2api-*
            dist/checksums.txt