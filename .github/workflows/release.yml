name: Release

on:
  push:
    tags: ['v*']
  # 手动重发：在 Actions 页面选 tag ref 触发——发布资产坏了/缺了不用
  # 重打 tag（铁律：已推送的 tag 永不重打）。validate job 负责把
  # 误选 branch ref 的 dispatch 拦在门外。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # tag 形态与注解性校验：dispatch 可以选任意 ref，release.yml 的全部
  # 下游语义（版本号、tag 注解取 notes）都依赖它真指着 annotated tag。
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert annotated v* tag on remote
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release 必须由 v* tag 触发或在 tag ref 上 dispatch（got $GITHUB_REF）"; exit 1 ;;
          esac
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          [[ "$type" == "tag" ]] || {
            echo "::error::${GITHUB_REF_NAME} 是 lightweight tag（$type），tag 注解是 release notes 的唯一事实源"
            exit 1
          }
          # tag 落点必须与本次运行的提交一致：dispatch 选了别的 ref 时
          # GITHUB_SHA 是所选 ref 的顶端，与 tag 指向不同即拒绝。
          target="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          [[ "$target" == "$GITHUB_SHA" ]] || {
            echo "::error::tag ${GITHUB_REF_NAME} 指向 $target，与运行提交 $GITHUB_SHA 不一致"
            exit 1
          }

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Test
        run: go test -shuffle=on ./...

  binaries:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: devin-2api-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: devin-2api-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: devin-2api-linux-amd64
          - goos: linux
            goarch: arm64
            asset: devin-2api-linux-arm64
          # Windows 资产是 zip 包（exe + config.example.yaml + LICENSE）：
          # 该平台没有 deploy 脚本消费裸 exe，归档让用户一次下载即可运行；
          # unix 资产保持裸二进制，deploy 脚本直接下载热替换。
          - goos: windows
            goarch: amd64
            asset: devin-2api-windows-amd64.zip
          - goos: windows
            goarch: arm64
            asset: devin-2api-windows-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out="dist/${{ matrix.asset }}"
          [[ "${{ matrix.goos }}" == "windows" ]] && out="dist/devin-2api.exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "${out}" ./cmd/devin-2api

      # CGO_ENABLED=0 的产物不应声明解释器；出现 program interpreter 说明
      # 意外引入了 cgo 依赖——alpine/scratch 镜像里会跑不起来。
      - name: Assert static binary
        if: matrix.goos == 'linux'
        run: |
          if readelf -l "dist/${{ matrix.asset }}" | grep -q "Requesting program interpreter"; then
            echo "::error::${{ matrix.asset }} 不是静态二进制（有 program interpreter）"
            exit 1
          fi

      - name: Package windows zip
        if: matrix.goos == 'windows'
        run: |
          cp config.example.yaml LICENSE dist/
          cd dist
          zip -q "${{ matrix.asset }}" devin-2api.exe config.example.yaml LICENSE
          rm devin-2api.exe config.example.yaml LICENSE

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Docker image + release
    needs: [test, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${GHCR}:${VERSION}"
          # 仅稳定版（无 - 后缀）推 MINOR/MAJOR 浮动 tag：v0.1.0 → 0.1, 0
          if [[ "${VERSION}" != *-* ]]; then
            MINOR="${VERSION%.*}"
            MAJOR="${VERSION%%.*}"
            TAGS="${TAGS},${GHCR}:${MINOR},${GHCR}:${MAJOR}"
          fi
          # latest 只跟随稳定版，预发布不动它
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS},${GHCR}:latest"
          fi
          # Docker Hub 在 secrets 配置后才会推送（条件登录见下）；
          # latest 与 GHCR 同规则——只跟随稳定版，预发布不抢它。
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            TAGS="${TAGS},docker.io/${DOCKERHUB_USERNAME}/devin-2api:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS},docker.io/${DOCKERHUB_USERNAME}/devin-2api:latest"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # 先下载 matrix 产物：Dockerfile.release 直接 COPY 它们（镜像二进制
      # 与 release 资产同源同 checksum），不再在镜像内重编，QEMU 可省。
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 浮动 tag 一致性断言：推完镜像后回读远端 manifest digest，
      # latest/minor/major 必须与精确版本同 digest——串线（别名指到
      # 别的构建）在发布当场炸，而不是等用户 pull 到错版本。
      - name: Verify published image aliases
        run: |
          set -euo pipefail
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ steps.meta.outputs.version }}"
          # 注册表有写后读延迟，inspect 偶发非零退出——重试且永不传播
          # 失败（否则 pipefail + $( ) 赋值会让脚本 255 静默死掉，连
          # ::error:: 都打不出来，v0.14.0 发布即踩此坑）。空输出交给
          # 调用方的显式检查报错。
          digest_of() {
            local i out
            for i in 1 2 3 4 5; do
              if out="$(docker buildx imagetools inspect "$1" 2>/dev/null)"; then
                awk '/^Digest:/{print $2; exit}' <<<"$out"
                return 0
              fi
              sleep 5
            done
          }
          base="$(digest_of "$GHCR:$VERSION")"
          [[ -n "$base" ]] || { echo "::error::读不到 $GHCR:$VERSION 的 manifest digest"; exit 1; }
          check_repo() {
            local repo="$1"
            local d
            d="$(digest_of "$repo:$VERSION")"
            [[ "$d" == "$base" ]] || { echo "::error::$repo:$VERSION digest $d != GHCR $base"; exit 1; }
            if [[ "$VERSION" != *-* ]]; then
              for tag in latest "${VERSION%.*}" "${VERSION%%.*}"; do
                [[ "$repo" == ghcr.io/* || "$tag" == "latest" ]] || continue
                d="$(digest_of "$repo:$tag")"
                [[ "$d" == "$base" ]] || { echo "::error::$repo:$tag digest $d != $base"; exit 1; }
              done
            fi
          }
          check_repo "$GHCR"
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            # DockerHub 只推 :VERSION 与 :latest（见上方 TAGS 计算）
            check_repo "docker.io/${DOCKERHUB_USERNAME}/devin-2api"
          fi
          echo "digest verified: $base"

      - name: Create checksums
        working-directory: dist
        run: sha256sum devin-2api-* | sort -k2 > checksums.txt

      # release notes 取 annotated tag 正文（release.sh 生成的分类 changelog），
      # 不再用 generate_release_notes——tag 即 notes 唯一事实源。
      # checkout 对 tag push 可能只留 lightweight ref，强制拉注解对象再取正文。
      - name: Extract release notes from tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/devin-2api-*
            dist/checksums.txt
