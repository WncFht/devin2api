name: Security

on:
  push:
    branches: [main]
  pull_request:
  # 每周一扫一遍：Go 漏洞库持续更新，已发布的依赖会后知后觉中招；
  # 错峰分钟，不跟其他仓库的整点 cron 挤同一时刻。
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
