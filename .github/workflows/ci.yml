name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Format check
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # 交叉编译门禁：build 覆盖平台 tag 文件，vet 额外覆盖测试文件——
      # 防止以后引入 unix-only 调用把 windows/darwin 编译打断。
      - name: Cross-compile check
        run: |
          for goos in windows darwin; do
            GOOS=$goos go build ./...
            GOOS=$goos go vet ./...
          done

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 与本地 brew 版对齐；规则集见 .golangci.yml（default:none 显式启用）
          version: v2.13.2

  # 部署资产防回归：plist/unit/共享库的关键字段断言，改坏在 CI 先炸。
  deploy-assets:
    name: Deploy assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert deploy assets
        run: bash scripts/deploy-assets.test.sh

      # release.sh 离线演练：bare origin + stub curl/gh，覆盖 dry-run
      # 版本计算与 publish 的全部拒绝分支，不触网。
      - name: release.sh self-test
        run: bash scripts/release-selftest.sh

  lint-markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:md
