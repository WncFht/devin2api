name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # go.mod/go.sum 与实际 import 失配（如直接依赖误标 // indirect）在这里
      # 拦下；-diff 只打印差异不改文件，非零退出即漂移。
      - name: Mod tidy check
        run: go mod tidy -diff

      - name: Format check
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -pgo=off：测试二进制不需要剖面引导优化——default.pgo 会让
      # all-protos.connect.go（1.8MB 生成代码）按 PGO 变体再编一遍，
      # 在低核 runner 上数倍放大编译时长。-timeout 兜底防挂死。
      - name: Test
        run: go test -race -pgo=off -timeout 300s ./...

      - name: Build
        run: go build ./...

      # 交叉编译门禁：build 覆盖平台 tag 文件，vet 额外覆盖测试文件——
      # 防止以后引入 unix-only 调用把 windows/darwin 编译打断。
      - name: Cross-compile check
        run: |
          for goos in windows darwin; do
            GOOS=$goos go build ./...
            GOOS=$goos go vet ./...
          done

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 与本地 brew 版对齐；规则集见 .golangci.yml（default:none 显式启用）
          version: v2.13.2

  # 部署资产防回归：plist/unit/共享库的关键字段断言，改坏在 CI 先炸。
  deploy-assets:
    name: Deploy assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert deploy assets
        run: bash scripts/deploy-assets.test.sh

      # release.sh 离线演练：bare origin + stub curl/gh，覆盖 dry-run
      # 版本计算与 publish 的全部拒绝分支，不触网。
      - name: release.sh self-test
        run: bash scripts/release-selftest.sh

  # 生产宿主是 macOS 而 CI 全在 ubuntu：darwin 构建此前只有交叉编译门禁，
  # 从没在真系统上跑过。这里补上真平台的测试与无 token 冒烟——exec、
  # 监听、SIGTERM 排空这层平台差异在这拦下（--no-upstream 不打真上游）。
  darwin-smoke:
    name: macOS smoke
    runs-on: macos-latest
    # 冷构建缓存下 smoke 的 go build 要过一次 PGO 编译（生成代码大头），
    # 给整 job 留 25 分钟护栏；正常应 <10 分钟。
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Test
        run: go test -pgo=off -timeout 300s ./...

      - name: Smoke without upstream
        run: bash scripts/smoke.sh --no-upstream --config config.example.yaml --port 18099

  lint-markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:md
